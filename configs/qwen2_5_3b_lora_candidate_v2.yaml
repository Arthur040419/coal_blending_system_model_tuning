# Candidate-generation LoRA config for Qwen2.5 3B.
# Ollama's qwen2.5:3b is a runtime tag; Transformers/PEFT training should use
# Qwen/Qwen2.5-3B-Instruct or a local HF-format model directory.
# This trains from a clean 3B base model on the backend-style v2 candidate data.
model_name_or_path: Qwen/Qwen2.5-3B-Instruct
train_file: data/processed_candidate_v2/train.jsonl
eval_file: data/processed_candidate_v2/eval.jsonl
output_dir: outputs/adapters/qwen2.5-3b-coal-candidate-v2-lora
datasets_cache_dir: outputs/cache/datasets

max_seq_length: 4096
sft_format: prompt_completion
filter_task: candidate_generation
completion_only_loss: true
assistant_only_loss: false
fail_on_truncated_completion: true

# 3B is lighter than Qwen3 4B, so run the full v2 train split for 2 epochs.
num_train_epochs: 2
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4
gradient_checkpointing: true
learning_rate: 0.00008
warmup_ratio: 0.05
logging_steps: 1
eval_strategy: "no"
save_strategy: "epoch"
save_total_limit: 2
eval_steps: 1000
save_steps: 1000

lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

use_4bit: true
bf16: false
fp16: true
allow_cpu_training: false
