# "Real-only" LoRA recipe — trains exclusively on the ~13 candidate samples
# derived from real SQL backend plans (drops every synthesized PUBLIC scenario).
#
# Rationale: the synthesized public-scenario labels are produced by a hand-coded
# heuristic with average_business_effect_score ≈ 0.87 and 成本优势 ≈ 0.56
# (see outputs/reports/candidate_gold_eval_report.json). Tuning toward them caps
# the LoRA at that mediocre business score. The real SQL plans are much more
# diverse in planName, strategy, ratios and risk text, even though there are
# only a dozen of them.
#
# Build the data once:
#   python3 scripts/build_dataset.py \
#     --tasks candidate \
#     --compact-candidate-context \
#     --real-only \
#     --candidate-prompt-style backend \
#     --output-dir data/processed_candidate_real_only
#
# Because the set is tiny, we use the most conservative LoRA possible:
#   - lr=1e-5, 2 epochs.
#   - q_proj + v_proj only, r=4 alpha=4 (extra-light delta).
#   - eval every 2 steps, best-checkpoint on eval_loss, patience=2.

model_name_or_path: Qwen/Qwen3-4B-Instruct-2507
train_file: data/processed_candidate_real_only/train.jsonl
eval_file: data/processed_candidate_real_only/eval.jsonl
output_dir: outputs/adapters/qwen3-4b-coal-candidate-real-only-lora
datasets_cache_dir: outputs/cache/datasets

max_seq_length: 4096
sft_format: prompt_completion
filter_task: candidate_generation
completion_only_loss: true
assistant_only_loss: false
fail_on_truncated_completion: true

num_train_epochs: 2
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4
gradient_checkpointing: true
learning_rate: 0.00001
warmup_ratio: 0.1
logging_steps: 1

lora_r: 4
lora_alpha: 4
lora_dropout: 0.05
target_modules:
  - q_proj
  - v_proj

eval_strategy: "steps"
save_strategy: "steps"
eval_steps: 2
save_steps: 2
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
early_stopping_patience: 2
early_stopping_threshold: 0.0

use_4bit: true
bf16: false
fp16: true
allow_cpu_training: false
